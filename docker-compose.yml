services:
  postgres:
    image: postgres:16
    container_name: pokesearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokesearch
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pokesearch-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d pokesearch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pokesearch-pgdata:
